---
- hosts: localhost
  become: yes

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include config override file, if it exists.
      include_vars: "{{ item }}"
      with_fileglob:
        - config.yml
      tags: ['always']

    - import_tasks: tasks/init.yml

  roles:
    - role: geerlingguy.git
      tags: ['git']

    - role: vscodium
      tags: ['apps', 'vscodium']

  tasks: []
